<mat-toolbar *ngIf="!showAppNavBar">
  <div class="fix-ww" id="root-tool-bar" title="toolbar">
    <ng-container *ngIf="mode === 'top'">
      <a class="logo-dim" role="link" title="Home" routerLink="/app/home" *ngIf="isSetUpPage">
        <img [src]="appIcon" alt="Application Logo" class="app-logo" />
      </a>
      <a class="logo-dim" role="link" title="Home" routerLink="/public/home" *ngIf="!isSetUpPage">
        <img [src]="appIcon" alt="Application Logo" class="app-logo" />
      </a>
    </ng-container>

  </div>
</mat-toolbar>
<ng-template #navbarSide let-item="item">
  <ng-container *ngIf="item.type === 'widgetButton'" [sbUiResolverWidget]="item.config"></ng-container>
  <ws-widget-btn-feature *ngIf="item.type === 'featureButton' && item.config.actionBtnId !== 'feature_notification'"
    [id]="item.config.actionBtnId" [widgetData]="item.config" [showFixedLength]="true"></ws-widget-btn-feature>
  <div class="p-4" *ngIf="item.type === 'notificationButton'">
    <div #notificationTrigger [matMenuTriggerFor]="menu" class="relative cursor-pointer" (click)="onBellClick()"
      title="Notifications" role="button" aria-label="Notifications" tabindex="0"
      (keydown.enter)="$event.preventDefault(); notificationTrigger.click(); onBellClick();"
      (keydown.escape)="$event.preventDefault(); notificationTrigger.click();">
      <mat-icon class="bell-icon">notifications</mat-icon>
      <span class="counter" *ngIf="notificationsCount > 0">{{notificationsCount > 9 ? '9+' : notificationsCount}}</span>
    </div>
    <mat-menu #menu="matMenu" xPosition="before" class="my-notifications" (closed)="onMenuClosed()">
      <div class="notification-container">
        <sb-uin-notification-dropdown (viewAllClick)="viewAllClick($event)" [unRead]="notificationsCount"
          *ngIf="showDropdown">
        </sb-uin-notification-dropdown>
      </div>
    </mat-menu>
  </div>
</ng-template>

<mat-menu #helpMenu="matMenu">
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'feature_aboutUs',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'channel_how_to',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'feature_FAQs',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'feature_quickTour',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <div mat-menu-item *ngIf="isTourGuideAvailable" (click)="startTour()">
    <mat-icon>help</mat-icon>
    <span class="ml-2">Tour Guide</span>
  </div>

</mat-menu>
