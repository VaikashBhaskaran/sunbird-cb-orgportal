<ng-container class="m-4">
    <div class="appar-wrapper p-4">
        <div class="flex justify-between items-center" [ngClass]="{'disable': aparCheckboxDisabled && isLiveContent}">
            <span class="apar-labels-heading">APAR Assignment</span>
            <div class="apar-checkbox-toggle">
                <input [(ngModel)]="isAparEnabled" type="checkbox" id="switch" (change)="onAparCheckboxChange($event)" />
                <label for="switch"><span class="cdk-visually-hidden">Enable APAR assignment</span></label>
            </div>
        </div>
        <span class="apar-labels-desc">If APAR Assignment is enabled, Karmayogis will see their assigned plans under the <b>APAR</b> section on the Home page.</span>
    </div>
</ng-container>
<ng-container>
    <ws-app-search [categoryData]="categoryData" [from]="from" (handleApiData)="handleApiData($event)"></ws-app-search>
</ng-container>
<ng-container>
    <div class="flex flex-row" *ngIf="contentData?.length > 0">
        <div class="flex-1">
            <ws-app-chip [selectedContentChips]="selectedContentChips" [from]="from" [selectContentCount]="selectContentCount"
                (itemRemoved)="itemsRemovedFromChip()"></ws-app-chip>
            <ws-app-standard-card [cardSize]="3" [contentData]="contentData" [showPagination]="true" [count]="count"
                (handleSelectedChips)="handleSelectedChips($event)"></ws-app-standard-card>
        </div>
        <div class="flex-2 margin-left-s margin-top-s">
            <ws-app-competency-summary [contentData]="selectedContentData"
                [selectContentCount]="selectContentCount"></ws-app-competency-summary>
            <!-- Gating courses only mean anything on an APAR plan, they are the set the
                 comprehensive assessment unlock is derived from -->
            <div class="margin-top-m" *ngIf="isAparEnabled">
                <ws-app-gating-courses [contentData]="selectedContentData"></ws-app-gating-courses>
            </div>
        </div>
    </div>
    <div class="no-cbp-data margin-top-xl margin-bottom-xl" *ngIf="!(contentData) || !(contentData?.length)">
        <div class="customimg"><img src="/assets/images/nocontent.svg" alt="nocontent">
            <span class="nocontent-question-mark">?</span>
        </div>
        <!-- <div class="mat-subheading-1 margin-remove">No content avaliable.</div> -->
        <!-- <div>Create a content in CBP portal to get the contents.</div> -->
        <div class="mat-subheading-1 margin-top-m margin-bottom-m">Can't find content?</div>
        <button mat-button type="button" class="create-btn" (click)="showAddContentDialog()">Request for new
            content</button>
    </div>

</ng-container>
