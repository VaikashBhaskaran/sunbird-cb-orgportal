<mat-card id="profdetails"
  class="flex flex-1 flex-column margin-left-m margin-bottom-m margin-right-m ws-mat-accent-border">
  <div class="flex-custom">
    <mat-card-content class="margin-top-m margin-bottom-m margin-left-m margin-right-m">
      <span class="mat-subheading-1 flex-4 mobile-margin appr-section-heading" role="link" tabindex="0">
        Professional details
      </span>
      <div class="margin-top-xl new-mobile" *ngIf="professionalDetails">
        <div class="flex flex-wrap mobile-break">
          <div class="w-full profile-cols-full bg-grey">
            <ng-container>
              <mat-grid-list cols="1" rowHeight="100px">
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <span id="position-type-of-organisation-label" class="appr-text-label">Type of organisation</span>
                  <mat-radio-group aria-labelledby="position-type-of-organisation-label" [value]="professionalDetails.organisationType" [disabled]="true"
                    aria-label="Select an option">
                    <mat-radio-button value="Government" class="radio-btn">Government organisation</mat-radio-button>
                    <mat-radio-button value="Non-Government" class="radio-btn">Non-government organisation
                    </mat-radio-button>
                  </mat-radio-group>
                </mat-grid-tile>

                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-mdo" class="appr-text-label">MDO</label>
                  <input id="position-mdo" type="text" [disabled]="true" class="appr-text-field"
                    [value]="employmentDetails?.departmentName">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-industry" class="appr-text-label">Industry</label>
                  <input id="position-industry" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-group" class="appr-text-label">Group</label>
                  <input id="position-group" type="text" [disabled]="true"
                    [value]="professionalDetails.group ? professionalDetails.group : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-designation" class="appr-text-label">Designation</label>
                  <input id="position-designation" type="text" [disabled]="true"
                    [value]="professionalDetails.designation ? professionalDetails.designation : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-location" class="appr-text-label">Location</label>
                  <input id="position-location" type="text" [disabled]="true"
                    [value]="professionalDetails.location ? professionalDetails.location : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-description" class="appr-text-label">Description</label>
                  <textarea id="position-description" [disabled]="true" rows="2"
                    [value]="professionalDetails.description ? professionalDetails.description : ''"
                    class="appr-text-field"></textarea>
                </mat-grid-tile>
              </mat-grid-list>

              <mat-grid-list cols="1" rowHeight="50px" class="margin-top-xl">
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <span class="appr-text-label middle-heading">Other details for government employess (If
                    applicable)</span>
                </mat-grid-tile>
              </mat-grid-list>

              <mat-grid-list cols="2" rowHeight="100px">
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label for="position-pay-band-grade-pay" class="appr-text-label">Pay band (grade pay)</label>
                  <input id="position-pay-band-grade-pay" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-service" class="appr-text-label">Service</label>
                  <input id="position-service" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-cadre" class="appr-text-label">Cadre</label>
                  <input id="position-cadre" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-allotment-year-of-service" class="appr-text-label">Allotment year of service</label>
                  <input id="position-allotment-year-of-service" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-date-of-joining" class="appr-text-label">Date of joining</label>
                  <input id="position-date-of-joining" type="text" [disabled]="true" [value]="professionalDetails.doj ? professionalDetails.doj : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-civil-list-number" class="appr-text-label">Civil list number</label>
                  <input id="position-civil-list-number" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label for="position-employee-code" class="appr-text-label">Employee code</label>
                  <input id="position-employee-code" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label for="position-location-2" class="appr-text-label">Location</label>
                  <input id="position-location-2" type="text" [disabled]="true"
                    [value]="professionalDetails.location ? professionalDetails.location : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label for="position-official-postal-address" class="appr-text-label">Official Postal address</label>
                  <textarea id="position-official-postal-address" [disabled]="true" rows="2"
                    [value]="professionalDetails.completePostalAddress ? professionalDetails.completePostalAddress : ''"
                    class="appr-text-field"></textarea>
                </mat-grid-tile>
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label for="position-pin-code" class="appr-text-label">Pin code</label>
                  <input id="position-pin-code" type="text" [disabled]="true"
                    [value]="professionalDetails.industry ? professionalDetails.industry : ''" class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <span id="position-tags-label" class="appr-text-label">Tags</span>
                  <mat-chip-list aria-labelledby="position-tags-label" #chipListTags *ngIf="selectedtags && selectedtags.length">
                    <mat-chip *ngFor="let tag of selectedtags" [selectable]="true" [removable]="true"
                      (removed)="removeActivity(tag)">
                      {{ tag }}
                      <!-- <mat-icon matChipRemove>cancel</mat-icon> -->
                    </mat-chip>
                  </mat-chip-list>
                  <p *ngIf="!selectedtags || !selectedtags.length">No tags available</p>
                </mat-grid-tile>
              </mat-grid-list>
            </ng-container>
          </div>
        </div>
      </div>
    </mat-card-content>
  </div>
</mat-card>
